<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ClawMingle</title>
  <desc id="desc">Group chat messages flow past a low-cost Jev gate; most stay silent and only the message that needs the agent reaches it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#16233b"/>
      <stop offset="1" stop-color="#0f3a44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>

  <!-- Title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="72" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Claw<tspan fill="url(#accent)">Mingle</tspan></text>
    <text x="74" y="200" font-size="24" font-weight="600" fill="#cbd5e1">The AI group member that knows when to speak.</text>
    <text x="74" y="240" font-size="22" fill="#94a3b8">懂得何时开口的 AI 群友 · 低成本判断，按需唤起 Agent</text>
    <g font-size="15" font-weight="600">
      <rect x="74" y="272" width="118" height="32" rx="16" fill="#5eead4" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.5"/>
      <text x="133" y="293" text-anchor="middle" fill="#99f6e4">Jev gating</text>
      <rect x="204" y="272" width="168" height="32" rx="16" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="288" y="293" text-anchor="middle" fill="#c7d2fe">Codex App Server</text>
      <rect x="384" y="272" width="92" height="32" rx="16" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.45"/>
      <text x="430" y="293" text-anchor="middle" fill="#fbcfe8">QQ Bot</text>
    </g>
  </g>

  <!-- Chat flow illustration -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', Helvetica, Arial, sans-serif" font-size="14">
    <!-- incoming messages (dimmed = silent) -->
    <g opacity="0.42">
      <rect x="690" y="58" width="150" height="34" rx="17" fill="#334155"/>
      <text x="765" y="80" text-anchor="middle" fill="#e2e8f0">哈哈哈哈</text>
      <rect x="690" y="104" width="190" height="34" rx="17" fill="#334155"/>
      <text x="785" y="126" text-anchor="middle" fill="#e2e8f0">晚上吃啥？火锅？</text>
      <rect x="690" y="222" width="170" height="34" rx="17" fill="#334155"/>
      <text x="775" y="244" text-anchor="middle" fill="#e2e8f0">[表情]</text>
      <rect x="690" y="268" width="140" height="34" rx="17" fill="#334155"/>
      <text x="760" y="290" text-anchor="middle" fill="#e2e8f0">+1</text>
    </g>
    <!-- the message that matters -->
    <rect x="690" y="160" width="230" height="40" rx="20" fill="#1e293b" stroke="url(#accent)" stroke-width="2"/>
    <text x="805" y="185" text-anchor="middle" fill="#f8fafc" font-weight="600">谁能帮忙查下这个报错？</text>

    <!-- Jev gate -->
    <circle cx="985" cy="180" r="58" fill="url(#glow)"/>
    <circle cx="985" cy="180" r="34" fill="#0f172a" stroke="#5eead4" stroke-width="2.5"/>
    <text x="985" y="186" text-anchor="middle" fill="#5eead4" font-weight="800" font-size="17">Jev</text>
    <path d="M920 180 H948" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M852 75 C 920 75, 930 150, 955 160" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M880 121 C 920 121, 930 160, 952 168" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M860 239 C 920 239, 930 200, 952 192" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M830 285 C 920 285, 935 210, 955 200" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 5"/>

    <!-- agent -->
    <path d="M1020 180 H1062" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1056 173 L1066 180 L1056 187" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1072" y="150" width="88" height="60" rx="16" fill="#818cf8" fill-opacity="0.18" stroke="#818cf8" stroke-width="2"/>
    <text x="1116" y="177" text-anchor="middle" fill="#e0e7ff" font-weight="700">Agent</text>
    <text x="1116" y="197" text-anchor="middle" fill="#a5b4fc" font-size="12">reply · task</text>

    <text x="985" y="262" text-anchor="middle" fill="#64748b" font-size="13">silent → archived only</text>
  </g>
</svg>
