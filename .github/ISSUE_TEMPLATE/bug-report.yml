name: "\U0001F41B Bug 报告 / Bug Report"
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间提交 Bug 报告！请尽量完整地填写以下信息，这有助于快速定位问题。
        **请勿粘贴 AppSecret、API Key、Cookie、群/成员 OpenID 或聊天原文等隐私内容。**

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 清楚描述你遇到的问题，包括实际行为和期望行为
      placeholder: |
        **实际行为：** 在 mode-3 群里被 @ 后机器人没有回复，管理台显示请求状态为 ...
        **期望行为：** 被 @ 时应当回复
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to Reproduce
      description: 提供能稳定复现问题的最小步骤
      placeholder: |
        1. 将测试群设为 mode-3
        2. 在群里发送 "..."
        3. 观察回复与服务日志
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块 / Area
      multiple: true
      options:
        - 参与判断（Jev / 参与模式）
        - 请求追加、修订、取消
        - 回复投递 / 限流
        - 记忆 / 人格
        - 图片 / 语音
        - 表情包
        - 群文档
        - 工具 / 浏览器 / 技能
        - 管理台 / 首次设置
        - 安装器 / 部署
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 参与模式 / Participation Mode
      options:
        - mode-1
        - mode-2
        - mode-3
        - mode-all
        - 私聊
        - 不适用
    validations:
      required: false

  - type: textarea
    id: versions
    attributes:
      label: 版本信息 / Version Info
      description: 请贴出以下命令的输出
      render: shell
      placeholder: |
        $ uname -srm
        $ codex --version
        $ git -C /path/to/ClawMingle rev-parse --short HEAD
        $ systemctl --user is-active clawmingle.service clawmingle-admin.service
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图 / Logs & Screenshots
      description: 粘贴相关日志或截图（务必脱敏，去掉凭据、身份标识和聊天原文）
      render: shell
    validations:
      required: false
